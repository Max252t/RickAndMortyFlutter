name: rickandmortyflutter
description: "Каталог персонажей «Рика и Морти» — ЛР3 «Сеть»"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  intl: ^0.20.3
  bloc_concurrency: ^0.3.0
  dio: ^5.11.1
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  # Код AppLocalizations генерируется из lib/l10n/*.arb при pub get и сборке.
  generate: true
  # Шрифт локально: без него web-сборка идёт за Roboto на
  # fonts.gstatic.com, и без сети кириллица не рисуется. Лицензия Apache 2.0.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
